[package]
name = "scope-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "FFUF Online Scope Enforcement Engine — the single authority for scope decisions, CIDR/IP guards and egress policy."
license = "MIT"

[lib]
name = "scope_engine"
path = "src/lib.rs"

[[bin]]
name = "scope-engine"
path = "src/bin/scope-engine.rs"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
ipnet = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pinned: uuid 1.12+ raised its MSRV above our toolchain (Rust 1.85).
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
